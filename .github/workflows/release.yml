name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f version.json ]; then
            echo "错误：找不到 version.json"
            exit 1
          fi

          MAJOR=$(jq -r '.major' version.json)

          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "错误：major 必须是整数"
            exit 1
          fi

          LAST=$(
            gh release list \
              --limit 1000 \
              --json tagName \
              --jq '.[].tagName' |
            grep -E "^v${MAJOR}\.[0-9]+$" |
            sed "s/^v${MAJOR}\.//" |
            sort -n |
            tail -1 || true
          )

          if [ -z "$LAST" ]; then
            MINOR=0
          else
            MINOR=$((LAST + 1))
          fi

          VERSION="${MAJOR}.${MINOR}"
          TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "版本: $VERSION"
          echo "Tag: $TAG"

      - name: Get build information
        id: build_info
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          SHA=$(git rev-parse HEAD)
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          LAST_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s")
          else
            NOTES=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s")
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- No changes recorded"
          fi

          DELIMITER=$(uuidgen)

          {
            echo "notes<<$DELIMITER"
            echo "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          cd frontend
          npm ci --no-fund --no-audit
          npm run build
          cd ..

          rm -rf cmd/ffmpeg-remote-ui/web
          mkdir -p cmd/ffmpeg-remote-ui/web
          cp -R frontend/dist/. cmd/ffmpeg-remote-ui/web/

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.build_info.outputs.commit }}
          BUILD_DATE: ${{ steps.build_info.outputs.date }}
        run: |
          mkdir -p dist

          export CGO_ENABLED=0

          LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$BUILD_DATE"

          GOOS=linux GOARCH=amd64 \
            go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
            -o dist/ffmpeg-remote-ui-linux-amd64 ./cmd/ffmpeg-remote-ui

          GOOS=linux GOARCH=arm64 \
            go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
            -o dist/ffmpeg-remote-ui-linux-arm64 ./cmd/ffmpeg-remote-ui

          GOOS=linux GOARCH=arm GOARM=7 \
            go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
            -o dist/ffmpeg-remote-ui-linux-armv7 ./cmd/ffmpeg-remote-ui

          GOOS=linux GOARCH=loong64 \
            go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
            -o dist/ffmpeg-remote-ui-linux-loong64 ./cmd/ffmpeg-remote-ui

          GOOS=linux GOARCH=riscv64 \
            go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
            -o dist/ffmpeg-remote-ui-linux-riscv64 ./cmd/ffmpeg-remote-ui

          GOOS=windows GOARCH=amd64 \
            go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
            -o dist/ffmpeg-remote-ui-windows-amd64.exe ./cmd/ffmpeg-remote-ui

          GOOS=windows GOARCH=arm64 \
            go build -mod=readonly -trimpath -ldflags "$LDFLAGS" \
            -o dist/ffmpeg-remote-ui-windows-arm64.exe ./cmd/ffmpeg-remote-ui

          cp LICENSE dist/LICENSE

          sha256sum dist/* > dist/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.build_info.outputs.sha }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi

          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --target "$TARGET" \
            --notes "$NOTES"